<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Despachante — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:#0B1F3A; --blue:#1A4A8A; --sky:#2E86DE; --accent:#F4A733;
      --light:#EEF4FF; --white:#FFFFFF; --gray:#6B7A99; --text:#1C2B40;
      --border:#D6E0F0; --green:#27AE60; --red:#E03D3D;
    }
    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,var(--navy) 0%,#142d5e 60%,#1A4A8A 100%);
      min-height:100vh; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:2rem 1rem;
    }
    .top-logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.5rem; color:var(--white); margin-bottom:1.8rem; text-decoration:none; letter-spacing:-.5px; }
    .top-logo span { color:var(--accent); }
    .card { background:var(--white); border-radius:18px; width:100%; max-width:440px; padding:2.4rem 2.2rem; box-shadow:0 24px 60px rgba(0,0,0,0.3); }
    .tabs { display:grid; grid-template-columns:1fr 1fr; background:var(--light); border-radius:10px; padding:4px; margin-bottom:2rem; }
    .tab { padding:.65rem; text-align:center; font-size:.92rem; font-weight:600; color:var(--gray); cursor:pointer; border-radius:8px; transition:all .2s; border:none; background:none; font-family:'Inter',sans-serif; }
    .tab.active { background:var(--white); color:var(--navy); box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .social-btns { display:flex; flex-direction:column; gap:.75rem; margin-bottom:1.5rem; }
    .social-btn { display:flex; align-items:center; justify-content:center; gap:.75rem; padding:.75rem 1rem; border-radius:9px; border:1.5px solid var(--border); font-size:.93rem; font-weight:600; cursor:pointer; background:var(--white); color:var(--text); transition:all .15s; font-family:'Inter',sans-serif; }
    .social-btn:hover { background:var(--light); border-color:var(--sky); }
    .social-btn svg { width:20px; height:20px; flex-shrink:0; }
    .social-btn.whatsapp { border-color:#25D366; color:#128C7E; }
    .social-btn.whatsapp:hover { background:#f0fff4; }
    .divider { display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem; color:var(--gray); font-size:.83rem; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
    .form-panel { display:none; }
    .form-panel.active { display:block; }
    .form-row { margin-bottom:1.1rem; }
    .form-row label { display:block; font-size:.82rem; font-weight:600; color:var(--text); margin-bottom:.4rem; }
    .input-wrap { position:relative; }
    .input-wrap input { width:100%; padding:.75rem 1rem; border:1.5px solid var(--border); border-radius:9px; font-size:.95rem; font-family:'Inter',sans-serif; color:var(--text); outline:none; transition:border-color .2s,box-shadow .2s; }
    .input-wrap input:focus { border-color:var(--sky); box-shadow:0 0 0 3px rgba(46,134,222,0.12); }
    .toggle-pw { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--gray); font-size:.85rem; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
    .forgot { text-align:right; margin-top:-.4rem; margin-bottom:1rem; }
    .forgot a { font-size:.82rem; color:var(--sky); text-decoration:none; }
    .terms-row { display:flex; align-items:flex-start; gap:.6rem; margin-bottom:1.2rem; }
    .terms-row input[type="checkbox"] { margin-top:2px; width:16px; height:16px; accent-color:var(--sky); flex-shrink:0; cursor:pointer; }
    .terms-row label { font-size:.82rem; color:var(--gray); cursor:pointer; line-height:1.5; }
    .terms-row a { color:var(--sky); text-decoration:none; }
    .btn-submit { width:100%; background:var(--navy); color:var(--white); border:none; padding:.88rem; border-radius:9px; font-size:1rem; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; transition:background .2s,transform .15s; display:flex; align-items:center; justify-content:center; gap:.5rem; }
    .btn-submit:hover { background:var(--blue); transform:translateY(-1px); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .spinner { width:18px; height:18px; border:2.5px solid rgba(255,255,255,0.3); border-top-color:var(--white); border-radius:50%; animation:spin .7s linear infinite; display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--navy); color:var(--white); padding:.85rem 1.6rem; border-radius:10px; font-size:.9rem; font-weight:500; box-shadow:0 8px 32px rgba(0,0,0,0.3); transition:transform .35s cubic-bezier(.34,1.56,.64,1); z-index:200; white-space:nowrap; }
    .toast.show { transform:translateX(-50%) translateY(0); }
    .toast.ok { border-left:4px solid var(--green); }
    .toast.err { border-left:4px solid var(--red); }
    .back-link { margin-top:1.4rem; text-align:center; font-size:.85rem; color:rgba(255,255,255,0.6); }
    .back-link a { color:var(--accent); text-decoration:none; font-weight:600; }
    .field-error { font-size:.78rem; color:var(--red); margin-top:.3rem; display:none; }
    @media(max-width:480px){ .card{padding:1.8rem 1.3rem;} .two-col{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <a href="index.html" class="top-logo">Portal<span>Despachante</span></a>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('cadastro')">Criar Conta</button>
    </div>

    <div class="social-btns">
      <button class="social-btn" onclick="loginGoogle()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar com Google
      </button>
     
    </div>

    <div class="divider">ou acesse com e-mail</div>

    <!-- LOGIN -->
    <div class="form-panel active" id="panel-login">
      <div class="form-row">
        <label>E-mail</label>
        <div class="input-wrap"><input type="email" id="login-email" placeholder="seu@email.com" /></div>
        <div class="field-error" id="err-login-email">Informe um e-mail válido.</div>
      </div>
      <div class="form-row">
        <label>Senha</label>
        <div class="input-wrap">
          <input type="password" id="login-senha" placeholder="Sua senha" />
          <button class="toggle-pw" onclick="togglePw('login-senha',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-login-senha">Informe sua senha.</div>
      </div>
      <div class="forgot"><a href="#" onclick="recuperarSenha()">Esqueci minha senha</a></div>
      <button class="btn-submit" id="btn-login" onclick="handleLogin()">
        <span class="spinner" id="spin-login"></span>
        Entrar
      </button>
    </div>

    <!-- CADASTRO -->
    <div class="form-panel" id="panel-cadastro">
      <div class="two-col">
        <div class="form-row">
          <label>Nome</label>
          <div class="input-wrap"><input type="text" id="cad-nome" placeholder="João" /></div>
          <div class="field-error" id="err-cad-nome">Informe seu nome.</div>
        </div>
        <div class="form-row">
          <label>Sobrenome</label>
          <div class="input-wrap"><input type="text" id="cad-sobrenome" placeholder="Silva" /></div>
        </div>
      </div>
      <div class="form-row">
        <label>E-mail</label>
        <div class="input-wrap"><input type="email" id="cad-email" placeholder="seu@email.com" /></div>
        <div class="field-error" id="err-cad-email">Informe um e-mail válido.</div>
      </div>
      <div class="form-row">
        <label>CPF ou CNPJ</label>
        <div class="input-wrap"><input type="text" id="cad-doc" placeholder="000.000.000-00" maxlength="18" oninput="maskDoc(this)" /></div>
        <div class="field-error" id="err-cad-doc">Informe CPF ou CNPJ.</div>
      </div>
      <div class="form-row">
        <label>WhatsApp</label>
        <div class="input-wrap"><input type="tel" id="cad-whatsapp" placeholder="(51) 99999-9999" maxlength="15" oninput="maskPhone(this)" /></div>
      </div>
      <div class="form-row">
        <label>Senha</label>
        <div class="input-wrap">
          <input type="password" id="cad-senha" placeholder="Mín. 8 caracteres" />
          <button class="toggle-pw" onclick="togglePw('cad-senha',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-cad-senha">A senha deve ter ao menos 8 caracteres.</div>
      </div>
      <div class="form-row">
        <label>Confirmar Senha</label>
        <div class="input-wrap">
          <input type="password" id="cad-confirma" placeholder="Repita a senha" />
          <button class="toggle-pw" onclick="togglePw('cad-confirma',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-cad-confirma">As senhas não coincidem.</div>
      </div>
      <div class="terms-row">
        <input type="checkbox" id="terms" />
        <label for="terms">Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> (LGPD)</label>
      </div>
      <button class="btn-submit" id="btn-cadastro" onclick="handleCadastro()">
        <span class="spinner" id="spin-cad"></span>
        Criar Conta
      </button>
    </div>
  </div>

  <div class="back-link"><a href="index.html">← Voltar ao site</a></div>
  <div class="toast" id="toast"></div>

  <script>
    // Supabase
    const { createClient } = supabase;
    const sb = createClient(
      'https://ofutxldgzocvfjcjemlk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mdXR4bGRnem9jdmZqY2plbWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjI4OTQsImV4cCI6MjEwMDU5ODg5NH0.XmmfRPwOy4ZxW4OmHyNeYQY3SRIs2wLu-b3suLKV2XA'
    );

    // Verificar se já está logado
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='cadastro')));
      document.getElementById('panel-login').classList.toggle('active', tab==='login');
      document.getElementById('panel-cadastro').classList.toggle('active', tab==='cadastro');
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    function showToast(msg, type='ok') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast '+type;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 3500);
    }

    function setLoading(btnId, spinId, loading) {
      document.getElementById(btnId).disabled = loading;
      document.getElementById(spinId).style.display = loading ? 'inline-block' : 'none';
    }

    function maskDoc(el) {
      let v = el.value.replace(/\D/g,'');
      if (v.length <= 11) v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
      else v = v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
      el.value = v;
    }

    function maskPhone(el) {
      let v = el.value.replace(/\D/g,'');
      v = v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2');
      el.value = v;
    }

    function setError(id, show) {
      const input = document.getElementById(id);
      const err = document.getElementById('err-'+id);
      if (!input || !err) return;
      input.style.borderColor = show ? 'var(--red)' : '';
      err.style.display = show ? 'block' : 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      setError('login-email', !emailOk);
      setError('login-senha', !senha);
      if (!emailOk || !senha) return;

      setLoading('btn-login','spin-login',true);
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      setLoading('btn-login','spin-login',false);

      if (error) {
        showToast('❌ ' + (error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos' : error.message), 'err');
      } else {
        showToast('✅ Login realizado!', 'ok');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      }
    }

    async function handleCadastro() {
      const nome     = document.getElementById('cad-nome').value.trim();
      const email    = document.getElementById('cad-email').value.trim();
      const doc      = document.getElementById('cad-doc').value.trim();
      const senha    = document.getElementById('cad-senha').value;
      const confirma = document.getElementById('cad-confirma').value;
      const whatsapp = document.getElementById('cad-whatsapp').value.trim();
      const terms    = document.getElementById('terms').checked;
      const emailOk  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      setError('cad-nome',    !nome);
      setError('cad-email',   !emailOk);
      setError('cad-doc',     doc.replace(/\D/g,'').length < 11);
      setError('cad-senha',   senha.length < 8);
      setError('cad-confirma',senha !== confirma || !confirma);

      if (!nome || !emailOk || doc.replace(/\D/g,'').length < 11 || senha.length < 8 || senha !== confirma) return;
      if (!terms) { showToast('⚠️ Aceite os Termos de Uso', 'err'); return; }

      setLoading('btn-cadastro','spin-cad',true);
      const { error } = await sb.auth.signUp({
        email,
        password: senha,
        options: {
          data: { nome: nome + ' ' + document.getElementById('cad-sobrenome').value.trim(), cpf_cnpj: doc, whatsapp }
        }
      });
      setLoading('btn-cadastro','spin-cad',false);

      if (error) {
        showToast('❌ ' + error.message, 'err');
      } else {
        showToast('🎉 Conta criada! Verifique seu e-mail.', 'ok');
        setTimeout(() => switchTab('login'), 2000);
      }
    }

    async function loginGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/dashboard.html' }
      });
      if (error) showToast('❌ Erro ao conectar com Google', 'err');
    }

    async function recuperarSenha() {
      const email = document.getElementById('login-email').value.trim();
      if (!email) { showToast('⚠️ Digite seu e-mail primeiro', 'err'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/login.html' });
      if (error) showToast('❌ Erro ao enviar e-mail', 'err');
      else showToast('📧 E-mail de recuperação enviado!', 'ok');
    }
  </script>
</body>
</html>
