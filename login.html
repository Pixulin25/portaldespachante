<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Despachante — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Tahoma', 'MS Sans Serif', Arial, sans-serif;
    background: #008080;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
  }

  .top-logo { color: white; font-weight: bold; font-size: 16px; margin-bottom: 12px; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .top-logo span { color: #FFCC00; }

  .card {
    background: #C0C0C0;
    border: 3px outset #C0C0C0;
    width: 100%; max-width: 380px;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.5);
  }
  .card-titlebar {
    background: linear-gradient(90deg,#000080,#1084d0);
    color: white; font-weight: bold; font-size: 12px;
    padding: 4px 8px;
  }
  .card-body { padding: 14px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 12px; border: 2px inset #C0C0C0; }
  .tab { padding: 6px; text-align: center; font-size: 11px; font-weight: bold; color: #000; cursor: pointer; background: #C0C0C0; border: none; font-family: 'Tahoma'; }
  .tab.active { background: #000080; color: white; }

  .social-btns { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .social-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; border: 2px outset #C0C0C0; font-size: 11px; font-weight: bold; cursor: pointer; background: #C0C0C0; color: #000; font-family: 'Tahoma'; }
  .social-btn:active { border: 2px inset #C0C0C0; }
  .social-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .social-btn.whatsapp { color: #006400; }

  .divider { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #333; font-size: 10px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #808080; }

  .form-panel { display: none; }
  .form-panel.active { display: block; }
  .form-row { margin-bottom: 8px; }
  .form-row label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 3px; }
  .input-wrap { position: relative; }
  .input-wrap input { width: 100%; padding: 5px 8px; border: 2px inset #C0C0C0; font-size: 11px; font-family: 'Tahoma'; background: white; }
  .toggle-pw { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 11px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .forgot { text-align: right; margin-bottom: 8px; }
  .forgot a { font-size: 10px; color: #000080; text-decoration: none; font-weight: bold; }

  .terms-row { display: flex; align-items: flex-start; gap: 5px; margin-bottom: 10px; }
  .terms-row input[type="checkbox"] { margin-top: 2px; }
  .terms-row label { font-size: 10px; color: #333; }
  .terms-row a { color: #000080; font-weight: bold; }

  .btn-submit { width: 100%; background: #C0C0C0; border: 2px outset #C0C0C0; color: #000; padding: 7px; font-size: 12px; font-weight: bold; cursor: pointer; font-family: 'Tahoma'; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-submit:active { border: 2px inset #C0C0C0; }
  .btn-submit:disabled { opacity: .5; }

  .spinner { width: 12px; height: 12px; border: 2px solid #808080; border-top-color: #000080; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(80px); background: #C0C0C0; border: 2px outset #C0C0C0; color: #000; padding: 8px 16px; font-size: 11px; font-weight: bold; z-index: 200; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { border-left: 5px solid #008000; }
  .toast.err { border-left: 5px solid #ff0000; }

  .field-error { font-size: 9px; color: #ff0000; margin-top: 2px; display: none; font-weight: bold; }
  .back-link { margin-top: 12px; text-align: center; font-size: 10px; color: white; }
  .back-link a { color: #FFCC00; text-decoration: none; font-weight: bold; }

  @media(max-width:480px){ .two-col{ grid-template-columns:1fr; } }
</style></head>
<body>
<a href="index.html" class="top-logo">Portal<span>Despachante</span></a>
  <div style="display:flex;align-items:center;gap:.6rem;background:linear-gradient(90deg,#009739,#FFCC29,#002776);padding:.5rem 1.4rem;border-radius:100px;margin-bottom:1.8rem;box-shadow:0 4px 16px rgba(0,0,0,0.25)">
    <span style="font-size:1.2rem">🇧🇷</span>
    <span style="color:#fff;font-weight:800;font-size:.88rem;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,0.4)">O MAIS COMPLETO DO BRASIL</span>
  </div>  

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('cadastro')">Criar Conta</button>
    </div>

    <div class="social-btns">
      <button class="social-btn" onclick="loginGoogle()">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuar com Google
      </button>
     
    </div>

    <div class="divider">ou acesse com e-mail</div>

    <!-- LOGIN -->
    <div class="form-panel active" id="panel-login">
      <div class="form-row">
        <label>E-mail</label>
        <div class="input-wrap"><input type="email" id="login-email" placeholder="seu@email.com" /></div>
        <div class="field-error" id="err-login-email">Informe um e-mail válido.</div>
      </div>
      <div class="form-row">
        <label>Senha</label>
        <div class="input-wrap">
          <input type="password" id="login-senha" placeholder="Sua senha" />
          <button class="toggle-pw" onclick="togglePw('login-senha',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-login-senha">Informe sua senha.</div>
      </div>
      <div class="forgot"><a href="#" onclick="recuperarSenha()">Esqueci minha senha</a></div>
      <button class="btn-submit" id="btn-login" onclick="handleLogin()">
        <span class="spinner" id="spin-login"></span>
        Entrar
      </button>
    </div>

    <!-- CADASTRO -->
    <div class="form-panel" id="panel-cadastro">
      <div class="two-col">
        <div class="form-row">
          <label>Nome</label>
          <div class="input-wrap"><input type="text" id="cad-nome" placeholder="João" /></div>
          <div class="field-error" id="err-cad-nome">Informe seu nome.</div>
        </div>
        <div class="form-row">
          <label>Sobrenome</label>
          <div class="input-wrap"><input type="text" id="cad-sobrenome" placeholder="Silva" /></div>
        </div>
      </div>
      <div class="form-row">
        <label>E-mail</label>
        <div class="input-wrap"><input type="email" id="cad-email" placeholder="seu@email.com" /></div>
        <div class="field-error" id="err-cad-email">Informe um e-mail válido.</div>
      </div>
      <div class="form-row">
        <label>CPF ou CNPJ</label>
        <div class="input-wrap"><input type="text" id="cad-doc" placeholder="000.000.000-00" maxlength="18" oninput="maskDoc(this)" /></div>
        <div class="field-error" id="err-cad-doc">Informe CPF ou CNPJ.</div>
      </div>
      <div class="form-row">
        <label>WhatsApp</label>
        <div class="input-wrap"><input type="tel" id="cad-whatsapp" placeholder="(51) 99999-9999" maxlength="15" oninput="maskPhone(this)" /></div>
      </div>
      <div class="form-row">
        <label>Senha</label>
        <div class="input-wrap">
          <input type="password" id="cad-senha" placeholder="Mín. 8 caracteres" />
          <button class="toggle-pw" onclick="togglePw('cad-senha',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-cad-senha">A senha deve ter ao menos 8 caracteres.</div>
      </div>
      <div class="form-row">
        <label>Confirmar Senha</label>
        <div class="input-wrap">
          <input type="password" id="cad-confirma" placeholder="Repita a senha" />
          <button class="toggle-pw" onclick="togglePw('cad-confirma',this)" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="err-cad-confirma">As senhas não coincidem.</div>
      </div>
      <div class="terms-row">
        <input type="checkbox" id="terms" />
        <label for="terms">Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> (LGPD)</label>
      </div>
      <button class="btn-submit" id="btn-cadastro" onclick="handleCadastro()">
        <span class="spinner" id="spin-cad"></span>
        Criar Conta
      </button>
    </div>
  </div>

  <div class="back-link"><a href="index.html">← Voltar ao site</a></div>
  <div class="toast" id="toast"></div>

  <script>
    // Supabase
    const { createClient } = supabase;
    const sb = createClient(
      'https://ofutxldgzocvfjcjemlk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mdXR4bGRnem9jdmZqY2plbWxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMjI4OTQsImV4cCI6MjEwMDU5ODg5NH0.XmmfRPwOy4ZxW4OmHyNeYQY3SRIs2wLu-b3suLKV2XA'
    );

        // Verificar se já está logado
    (async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('erro') === 'confirme-email') {
        showToast('⚠️ Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada.', 'err');
        return;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user.email_confirmed_at) window.location.href = 'dashboard.html';
    })();

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='cadastro')));
      document.getElementById('panel-login').classList.toggle('active', tab==='login');
      document.getElementById('panel-cadastro').classList.toggle('active', tab==='cadastro');
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    function showToast(msg, type='ok') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast '+type;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 3500);
    }

    function setLoading(btnId, spinId, loading) {
      document.getElementById(btnId).disabled = loading;
      document.getElementById(spinId).style.display = loading ? 'inline-block' : 'none';
    }

    function maskDoc(el) {
      let v = el.value.replace(/\D/g,'');
      if (v.length <= 11) v = v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
      else v = v.replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
      el.value = v;
    }

    function maskPhone(el) {
      let v = el.value.replace(/\D/g,'');
      v = v.replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2');
      el.value = v;
    }

    function setError(id, show) {
      const input = document.getElementById(id);
      const err = document.getElementById('err-'+id);
      if (!input || !err) return;
      input.style.borderColor = show ? 'var(--red)' : '';
      err.style.display = show ? 'block' : 'none';
    }

    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      setError('login-email', !emailOk);
      setError('login-senha', !senha);
      if (!emailOk || !senha) return;

      setLoading('btn-login','spin-login',true);
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      setLoading('btn-login','spin-login',false);

      if (error) {
        showToast('❌ ' + (error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos' : error.message), 'err');
      } else {
        showToast('✅ Login realizado!', 'ok');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      }
    }

    async function handleCadastro() {
      const nome     = document.getElementById('cad-nome').value.trim();
      const email    = document.getElementById('cad-email').value.trim();
      const doc      = document.getElementById('cad-doc').value.trim();
      const senha    = document.getElementById('cad-senha').value;
      const confirma = document.getElementById('cad-confirma').value;
      const whatsapp = document.getElementById('cad-whatsapp').value.trim();
      const terms    = document.getElementById('terms').checked;
      const emailOk  = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

      setError('cad-nome',    !nome);
      setError('cad-email',   !emailOk);
      setError('cad-doc',     doc.replace(/\D/g,'').length < 11);
      setError('cad-senha',   senha.length < 8);
      setError('cad-confirma',senha !== confirma || !confirma);

      if (!nome || !emailOk || doc.replace(/\D/g,'').length < 11 || senha.length < 8 || senha !== confirma) return;
      if (!terms) { showToast('⚠️ Aceite os Termos de Uso', 'err'); return; }

      setLoading('btn-cadastro','spin-cad',true);
      const { error } = await sb.auth.signUp({
        email,
        password: senha,
        options: {
          data: { nome: nome + ' ' + document.getElementById('cad-sobrenome').value.trim(), cpf_cnpj: doc, whatsapp }
        }
      });
      setLoading('btn-cadastro','spin-cad',false);

      if (error) {
        showToast('❌ ' + error.message, 'err');
      } else {
        showToast('🎉 Conta criada! Verifique seu e-mail.', 'ok');
        setTimeout(() => switchTab('login'), 2000);
      }
    }

    async function loginGoogle() {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + '/dashboard.html' }
      });
      if (error) showToast('❌ Erro ao conectar com Google', 'err');
    }

    async function recuperarSenha() {
      const email = document.getElementById('login-email').value.trim();
      if (!email) { showToast('⚠️ Digite seu e-mail primeiro', 'err'); return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/login.html' });
      if (error) showToast('❌ Erro ao enviar e-mail', 'err');
      else showToast('📧 E-mail de recuperação enviado!', 'ok');
    }
  </script>
